// Test data for projection_no_labels suite.
// Small graph (5 users, 4 KNOWS edges) sufficient to exercise both the
// default (label indexes built) and opt-out (includeLabelIndexes: false)
// paths of graph_project without inflating test wall-clock time.
//
// Every node has a label (:User) and every edge has a type (:KNOWS) so
// label/type queries on projections built with labels are well-defined.
// When the projection is built with includeLabelIndexes: false, those same
// queries must fail with a clear QueryException - the core contract being
// tested here.

// Users (5 nodes, labels + properties)
0 :User name:"Alice" age:30
1 :User name:"Bob"   age:25
2 :User name:"Carol" age:35
3 :User name:"Dave"  age:28
4 :User name:"Eve"   age:32

// KNOWS relationships (4 edges: forms a chain 0->1->2->3->4)
0->1 :KNOWS since:2020
1->2 :KNOWS since:2021
2->3 :KNOWS since:2022
3->4 :KNOWS since:2023
